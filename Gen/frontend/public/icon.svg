<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef233c" />
      <stop offset="50%" stop-color="#d90429" />
      <stop offset="100%" stop-color="#8d0801" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle/Rounded Rect for Contrast on all tabs -->
  <rect width="32" height="32" rx="8" fill="#0c0c0e" />
  <!-- AI Core Icon -->
  <circle cx="16" cy="16" r="10" stroke="url(#aiGrad)" stroke-width="2" fill="none" filter="url(#glow)" />
  <circle cx="16" cy="16" r="7" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2" fill="none" opacity="0.8" />
  <!-- Inner Sparkle/Polygon -->
  <polygon points="16,10 19.5,16 16,22 12.5,16" fill="url(#aiGrad)" />
  <circle cx="16" cy="16" r="2.5" fill="#ffffff" />
</svg>
